# Render Blueprint — VizTravel / Tour API
# Dashboard: New → Blueprint → connect this repo
# Or create a Web Service manually with the settings below.

services:
  - type: web
    name: viztravel-api
    runtime: node
    plan: free
    rootDir: ExploreApp-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → Environment (do not commit secrets)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: viztravel
      - key: CORS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOW_DEMO_BOOKING
        value: "true"
